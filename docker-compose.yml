version: '2.4'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: swordmap
      POSTGRES_USER: jksp2026-bojovka
      POSTGRES_PASSWORD: swordmap-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jksp2026-bojovka"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: gunicorn swordmap_project.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./game_config.json:/app/game_config.json
      - ./assets:/app/assets
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  game_loop:
    build: .
    entrypoint: ["python", "manage.py"]
    command: ["process_game_state"]
    volumes:
      - ./data:/app/data
      - ./game_config.json:/app/game_config.json
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
